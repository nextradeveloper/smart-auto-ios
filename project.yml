# XcodeGen spec. CI runs `xcodegen generate` on macOS; the .xcodeproj is never committed.
name: SmartAuto
options:
  bundleIdPrefix: com.nextradeveloper
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
targets:
  SmartAuto:
    type: application
    platform: iOS
    sources:
      - path: SmartAuto
      - path: Shared
      # Software H.264 for Smart Auto's own dash screen (minih264e, CC0); see SoftH264.h.
      - path: Vendor/minih264
        excludes:
          - module.modulemap
          - SOURCE.txt
        compilerFlags:
          - -w
          - -O3
    info:
      path: SmartAuto/Info.plist
      properties:
        CFBundleDisplayName: Smart Auto
        CFBundleDevelopmentRegion: th
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        # Portrait; the full-screen dash map turns landscape (OrientationLock in SmartAutoApp.swift).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Smart Auto ต้องคุยกับจอรถผ่าน Wi-Fi ของรถเพื่อส่งภาพขึ้นจอ
        NSBonjourServices:
          - _EasyConn._tcp
        ITSAppUsesNonExemptEncryption: false
        # The dash screen keeps running behind the lock screen on location updates.
        # bluetooth-central reports the vehicle's Bluetooth dropping in the background, which
        # is when the parked spot is saved.
        UIBackgroundModes:
          - location
          - bluetooth-central
          - audio
        NSLocationWhenInUseUsageDescription: Smart Auto ใช้ตำแหน่งเพื่อแสดงแผนที่และความเร็วบนจอรถ จำจุดจอดรถ และนำทางกลับไปหารถ รวมถึงทำงานต่อขณะล็อกโทรศัพท์
        NSLocationAlwaysAndWhenInUseUsageDescription: Smart Auto ใช้ตำแหน่งเพื่อจำจุดจอดรถเมื่อคุณเดินออกห่างจากรถ แม้ไม่ได้เปิดแอป
        NSBluetoothAlwaysUsageDescription: Smart Auto ใช้ Bluetooth เพื่อสั่งงานรถ ZONTES และช่วยหารถเมื่ออยู่ใกล้
        # Navigation to the parked spot opens Google Maps when it is installed.
        LSApplicationQueriesSchemes:
          - comgooglemaps
        # iCarCast's local stream (127.0.0.1) presents a certificate for another name.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: SmartAuto/SmartAuto.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nextradeveloper.smartauto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextradeveloper.smartauto
        PRODUCT_NAME: SmartAuto
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/minih264
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS:
          - $(inherited)
          - -lresolv
    dependencies:
      - target: SmartAutoBroadcast
      - framework: Frameworks/Api.xcframework
        embed: false
      - sdk: ReplayKit.framework
      - sdk: CoreLocation.framework
      - sdk: CoreBluetooth.framework
      - sdk: CryptoKit.framework
      - sdk: Accelerate.framework
      - sdk: Network.framework
      - sdk: Security.framework

  SmartAutoBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: SmartAutoBroadcast
      - path: Shared
    info:
      path: SmartAutoBroadcast/Info.plist
      properties:
        CFBundleDisplayName: Smart Auto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Smart Auto ต้องคุยกับจอรถผ่าน Wi-Fi ของรถเพื่อส่งภาพขึ้นจอ
        NSBonjourServices:
          - _EasyConn._tcp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: SmartAutoBroadcast/SmartAutoBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nextradeveloper.smartauto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextradeveloper.smartauto.broadcast
        PRODUCT_NAME: SmartAutoBroadcast
        # The Go runtime inside Api.xcframework resolves DNS through libresolv.
        OTHER_LDFLAGS:
          - $(inherited)
          - -lresolv
    dependencies:
      # Built by CI from hudlib/ with `gomobile bind -target=ios`.
      - framework: Frameworks/Api.xcframework
        embed: false
      - sdk: ReplayKit.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: Security.framework

  SmartAutoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SmartAutoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextradeveloper.smartauto.tests
        GENERATE_INFOPLIST_FILE: YES
        # @testable import SmartAuto needs the C module the app imports.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/minih264
    dependencies:
      - target: SmartAuto
