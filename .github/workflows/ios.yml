name: iOS build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # TestFlight upload runs only once these repository secrets exist.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/setup-go@v5
        with:
          go-version-file: hudlib/go.mod
          cache-dependency-path: hudlib/go.sum

      - name: Build Api.xcframework (gomobile)
        working-directory: hudlib
        run: |
          set -euo pipefail
          # Same x/mobile revision as hudlib/go.mod, so gobind matches the bind package.
          MOBILE=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@"$MOBILE"
          go install golang.org/x/mobile/cmd/gobind@"$MOBILE"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init || true
          go vet ./hud/api
          gomobile bind -target=ios -iosversion=16.0 -o ../Frameworks/Api.xcframework ./hud/api
          find ../Frameworks/Api.xcframework -name '*.h' | head -20
          cat "$(find ../Frameworks/Api.xcframework -name 'Api.objc.h' | head -1)"

      - name: Go tests (informational)
        continue-on-error: true
        working-directory: hudlib
        run: go test ./hud/...

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project SmartAuto.xcodeproj \
            -scheme SmartAuto \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build/xcodebuild.log | grep -E 'error:|warning: .*(SmartAuto|Shared)|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' build/xcodebuild.log

      - name: Unit tests (protocol, find vehicle)
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime in data.values() for d in runtime if d["name"].startswith("iPhone")))')
          xcodebuild \
            -project SmartAuto.xcodeproj \
            -scheme SmartAuto \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/TestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:SmartAutoTests \
            test 2>&1 | tee build/protocol-tests.log
          grep -q 'TEST SUCCEEDED' build/protocol-tests.log

      - name: Revoke old CI development certificates
        if: env.ASC_KEY_ID != '' && env.APPLE_TEAM_ID != '' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # Each fresh runner makes a new Apple Development certificate while archiving, and
          # the account hits Apple's certificate limit after a few builds. Only development
          # certificates this API key created ("Created via API") are revoked; distribution
          # certificates and ones made by hand are kept. TestFlight builds are not affected.
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/asc/bin/python" - <<'PY'
          import json, os, time, urllib.error, urllib.request
          import jwt

          now = int(time.time())
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
              os.environ["ASC_KEY_P8"],
              algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
          )

          def call(method, path):
              request = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path,
                  method=method,
                  headers={"Authorization": "Bearer " + token},
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      body = response.read()
              except urllib.error.HTTPError as error:
                  print(method, path, error.code, error.read().decode(errors="replace"))
                  raise
              return json.loads(body) if body else None

          for certificate in call("GET", "/v1/certificates?limit=200")["data"]:
              attributes = certificate["attributes"]
              kind = attributes.get("certificateType")
              label = (attributes.get("displayName") or "") + " " + (attributes.get("name") or "")
              revoke = kind in ("DEVELOPMENT", "IOS_DEVELOPMENT") and "Created via API" in label
              print("revoke" if revoke else "keep  ", kind, label.strip(), attributes.get("expirationDate"))
              if revoke:
                  call("DELETE", "/v1/certificates/" + certificate["id"])
          PY

      - name: Archive and upload to TestFlight
        if: env.ASC_KEY_ID != '' && env.APPLE_TEAM_ID != '' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild \
            -project SmartAuto.xcodeproj \
            -scheme SmartAuto \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SmartAuto.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${AUTH[@]}" \
            archive 2>&1 | tee build/archive.log | grep -E 'error:|ARCHIVE (SUCCEEDED|FAILED)' || true
          grep -q 'ARCHIVE SUCCEEDED' build/archive.log
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/SmartAuto.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            "${AUTH[@]}" 2>&1 | tee build/export.log | grep -E 'error:|EXPORT (SUCCEEDED|FAILED)|Upload' || true
          grep -q 'EXPORT SUCCEEDED' build/export.log
          rm -f "$KEY_PATH"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: build/*.log
          if-no-files-found: ignore
